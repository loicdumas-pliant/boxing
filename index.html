:root{--bg:#011423;--card:#0c2236;--line:#1d3a55;--fg:#f4f4f6;--mut:#9fb0c0;--acc:#f1b310;--onacc:#011423}
body[data-mode="tabata"]{--acc:#fb923c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#home{max-width:520px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:68px;height:68px;border-radius:12px}h1{font-size:1.3rem;line-height:1.15;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--acc)}.sub{color:var(--mut);font-size:.85rem;margin-top:2px}
#inst{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.tab{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:1.05rem;padding:13px;border-radius:10px}
.tab[aria-selected="true"]{background:var(--acc);color:var(--onacc)}
.note{color:var(--mut);font-size:.92rem;margin:12px 2px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lbl{font-size:1rem;line-height:1.2}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#12304a;font-size:1.8rem;line-height:1;display:grid;place-items:center}
.step:active{background:var(--acc);color:var(--onacc)}
output{min-width:84px;text-align:center;font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
#sum{text-align:center;color:var(--mut);margin:14px 0}
#sum b{color:var(--fg)}
.opts{background:var(--card);border-radius:16px;padding:4px 14px;margin-top:6px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog input{width:24px;height:24px;accent-color:var(--acc)}
#reset{display:block;margin:16px auto 0;background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.9rem;padding:8px}
#startBar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
#start{display:block;width:100%;max-width:520px;margin:0 auto;height:64px;border:0;border-radius:18px;background:var(--acc);color:var(--onacc);font-size:1.3rem;font-weight:800;letter-spacing:.06em}
#start:active{filter:brightness(.85)}
/* écran de chrono */
#run{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;color:#fff;
 padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));transition:background .25s}
#run[data-phase="prep"]{background:#b45309}
#run[data-phase="work"]{background:#15803d}
#run[data-phase="rest"]{background:#b91c1c}
#run[data-phase="break"]{background:#6d28d9}
#run[data-phase="done"]{background:#1d4ed8}
.rtop{width:100%;display:flex;justify-content:space-between;font-size:1rem;opacity:.9;font-variant-numeric:tabular-nums}
.rmid{width:100%}
#rPhase{font-size:clamp(1.6rem,7vw,3rem);font-weight:800;letter-spacing:.08em}
#rTime{font-size:min(30vw,36vh);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin:.1em 0}
#run.paused #rTime{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
#rRound{font-size:clamp(1.1rem,5vw,1.8rem);opacity:.95}
.bar{height:10px;background:rgba(0,0,0,.28);border-radius:6px;overflow:hidden;margin:18px auto 0;max-width:560px}
#rBar{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.rctl{display:flex;gap:12px;width:100%;max-width:560px;justify-content:center}
.rctl button,.rdone button{border:0;border-radius:18px;background:rgba(0,0,0,.3);color:#fff;font-weight:700}
.rctl .sm{width:72px;height:72px;font-size:1.5rem}
.rctl .big{flex:1;height:72px;font-size:1.4rem}
#bStop{margin-top:10px;border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:14px;padding:12px 26px;font-weight:700}
.rdone{display:none;gap:12px;width:100%;max-width:560px}
.rdone button{flex:1;height:72px;font-size:1.2rem}
#run.done .rctl,#run.done #bStop{display:none}
#run.done .rdone{display:flex}
@media (orientation:landscape) and (max-height:480px){#rTime{font-size:34vh}.rctl .sm,.rctl .big{height:56px}}
</style>
</head>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='chrono-boxe-v1';
const DEF={boxe:{rounds:5,work:180,rest:60,prep:10},tabata:{rounds:8,work:20,rest:10,cycles:1,crest:60,prep:10}};
const FIELDS={
  boxe:[
    {k:'rounds',l:'Nombre de rounds',min:1,max:50,step:1,n:1},
    {k:'work',l:'Durée d’un round',min:15,max:900,step:15},
    {k:'rest',l:'Repos entre les rounds',min:0,max:600,step:5},
    {k:'prep',l:'Préparation',min:0,max:60,step:5}],
  tabata:[
    {k:'rounds',l:'Rounds par tour',min:1,max:50,step:1,n:1},
    {k:'work',l:'Effort',min:5,max:600,step:5},
    {k:'rest',l:'Repos entre les rounds',min:0,max:600,step:5},
    {k:'cycles',l:'Nombre de tours',min:1,max:99,step:1,n:1},
    {k:'crest',l:'Repos entre les tours',min:0,max:600,step:5},
    {k:'prep',l:'Préparation',min:0,max:60,step:5}]
};
const NOTES={
  boxe:'Réglez la durée des rounds, le repos et le nombre de rounds. Cloche au début et à la fin de chaque round.',
  tabata:'Cardio par intervalles. Un tour classique : 8 × (20 s d’effort + 10 s de repos), soit 4 minutes. Répétez-le en plusieurs tours, avec un repos entre chaque tour.'
};
const clone=o=>JSON.parse(JSON.stringify(o));
let st={mode:'boxe',cfg:clone(DEF),opt:{sound:true,vib:true,warn:true}};
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s){
    if(s.mode in DEF)st.mode=s.mode;
    for(const m in DEF)if(s.cfg&&s.cfg[m])for(const k in DEF[m])if(Number.isFinite(s.cfg[m][k]))st.cfg[m][k]=s.cfg[m][k];
    if(s.opt)for(const k in st.opt)if(typeof s.opt[k]==='boolean')st.opt[k]=s.opt[k];
  }
}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ---------- réglages ---------- */
function buildPhases(cfg){
  const p=[],C=cfg.cycles||1;
  if(cfg.prep>0)p.push({t:'prep',d:cfg.prep,r:0,c:1});
  for(let c=1;c<=C;c++){
    for(let i=1;i<=cfg.rounds;i++){
      p.push({t:'work',d:cfg.work,r:i,c});
      if(i<cfg.rounds&&cfg.rest>0)p.push({t:'rest',d:cfg.rest,r:i,c});
    }
    if(c<C&&cfg.crest>0)p.push({t:'break',d:cfg.crest,r:cfg.rounds,c});
  }
  return p;
}
function hold(btn,fn){
  let t,iv;
  const stop=()=>{clearTimeout(t);clearInterval(iv)};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();stop();fn();t=setTimeout(()=>{iv=setInterval(fn,90)},450)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
function show(f,out){const v=st.cfg[st.mode][f.k];out.textContent=f.n?v:fmt(v)}
function renderSettings(){
  const box=$('#fields');box.innerHTML='';
  FIELDS[st.mode].forEach(f=>{
    const row=document.createElement('div');row.className='field';
    row.innerHTML='<div class="lbl"></div><div class="stepper"><button class="step" aria-label="Moins">−</button><output></output><button class="step" aria-label="Plus">+</button></div>';
    row.querySelector('.lbl').textContent=f.l;
    const [minus,plus]=row.querySelectorAll('.step'),out=row.querySelector('output');
    const bump=d=>{
      const c=st.cfg[st.mode];
      c[f.k]=Math.min(f.max,Math.max(f.min,c[f.k]+d*f.step));
      show(f,out);summary();save();
    };
    hold(minus,()=>bump(-1));hold(plus,()=>bump(1));
    show(f,out);box.appendChild(row);
  });
  summary();
}
function summary(){
  const c=st.cfg[st.mode],tot=buildPhases(c).reduce((a,p)=>a+p.d,0);
  $('#sum').innerHTML='Durée totale : <b>'+fmt(tot)+'</b> · '+((c.cycles||1)>1?c.cycles+' tours × ':'')+c.rounds+(c.rounds>1?' rounds':' round');
}
function setMode(m){
  st.mode=m;document.body.dataset.mode=m;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
  $('#note').textContent=NOTES[m];
  $('#warnRow').hidden=m!=='boxe';
  renderSettings();save();
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('#reset').addEventListener('click',()=>{st.cfg[st.mode]=clone(DEF[st.mode]);renderSettings();save()});
[['#oSound','sound'],['#oVib','vib'],['#oWarn','warn']].forEach(([id,k])=>{
  const el=$(id);el.checked=st.opt[k];
  el.addEventListener('change',()=>{st.opt[k]=el.checked;save()});
});

/* ---------- audio ---------- */
let ac=null;
function unlockAudio(){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null}
}
function tone(f,t0,dur,type,gain){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(gain,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(ac.destination);
  o.start(t0);o.stop(t0+dur+0.05);
}
function ring(t){
  [[1,.35,1.6],[2.01,.18,1.0],[2.76,.14,.8],[4.07,.08,.5]].forEach(([m,g,d])=>tone(660*m,t,d,'sine',g));
}
function bell(t,n){for(let i=0;i<n;i++)ring(t+i*0.3)}
function clap(t){
  for(let k=0;k<2;k++){
    const n=Math.floor(ac.sampleRate*0.05),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
    s.buffer=b;g.gain.value=.9;f.type='bandpass';f.frequency.value=1800;
    s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t+k*.12);
  }
}
const vib=p=>{if(st.opt.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const snd=fn=>{if(st.opt.sound&&ac)try{fn(ac.currentTime+0.02)}catch(e){}};

/* ---------- veille écran ---------- */
let wl=null;
async function lockScreen(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&!S.done)lockScreen()});

/* ---------- chrono ---------- */
let S=null,timer=null;
const label=ph=>ph.t==='prep'?'PRÉPAREZ-VOUS':ph.t==='rest'?'REPOS':ph.t==='break'?'RÉCUPÉRATION':(S.mode==='boxe'?'ROUND '+ph.r:'EFFORT');

function enterPhase(i,startAt){
  const ph=S.phases[i];
  S.i=i;S.endAt=startAt+ph.d*1000;S.lastSec=ph.d;
  $('#run').dataset.phase=ph.t;
}
function phaseSound(ph){
  vib(ph.t==='work'?[250]:[120,80,120]);
  if(S.mode==='boxe'){
    if(ph.t==='work')snd(t=>bell(t,1));
    else if(ph.t==='rest')snd(t=>bell(t,2));
  }else{
    if(ph.t==='work')snd(t=>tone(1046,t,.6,'square',.22));
    else if(ph.t==='rest')snd(t=>tone(523,t,.6,'square',.22));
    else if(ph.t==='break')snd(t=>tone(392,t,.9,'square',.22));
  }
}
function onSecond(sec){
  const ph=S.phases[S.i];
  if(sec>=1&&sec<=3&&sec<ph.d)snd(t=>tone(880,t,.12,'sine',.35));
  if(S.mode==='boxe'&&st.opt.warn&&ph.t==='work'&&sec===10&&ph.d>12)snd(clap);
}
function tick(){
  if(!S||S.paused||S.done)return;
  const now=performance.now();
  let changed=false;
  while(now>=S.endAt){
    if(S.i+1>=S.phases.length){finish();return}
    enterPhase(S.i+1,S.endAt);changed=true;
  }
  if(changed)phaseSound(S.phases[S.i]);
  const rem=S.endAt-now,sec=Math.ceil(rem/1000);
  if(sec!==S.lastSec){S.lastSec=sec;onSecond(sec)}
  render(rem);
}
function render(rem){
  const ph=S.phases[S.i],N=S.cfg.rounds;
  $('#rPhase').textContent=label(ph);
  $('#rTime').textContent=fmt(Math.ceil(rem/1000));
  const C=S.cfg.cycles||1,tag=C>1?'Tour '+ph.c+' / '+C+' · ':'';
  $('#rRound').textContent=ph.t==='prep'?'Début imminent…':ph.t==='break'?'Prochain : tour '+(ph.c+1)+' / '+C:ph.t==='rest'?tag+'Prochain : round '+(ph.r+1)+' / '+N:tag+'Round '+ph.r+' / '+N;
  $('#rBar').style.transform='scaleX('+Math.min(1,Math.max(0,1-rem/(ph.d*1000)))+')';
  $('#rTotal').textContent='Reste '+fmt(Math.ceil(rem/1000)+S.after[S.i]);
}
function startRun(){
  unlockAudio();
  const cfg=clone(st.cfg[st.mode]);
  const phases=buildPhases(cfg);
  const after=phases.map((_,i)=>phases.slice(i+1).reduce((a,p)=>a+p.d,0));
  S={mode:st.mode,cfg,phases,after,i:0,paused:false,done:false};
  $('#run').className='';
  $('#rMode').textContent=st.mode==='boxe'?'Boxe':'Tabata';
  $('#bPause').textContent='Pause';
  $('#home').hidden=true;$('#startBar').hidden=true;$('#run').hidden=false;
  enterPhase(0,performance.now());
  phaseSound(phases[0]);
  render(phases[0].d*1000);
  clearInterval(timer);timer=setInterval(tick,100);
  lockScreen();
}
function finish(){
  S.done=true;clearInterval(timer);
  const run=$('#run');run.dataset.phase='done';run.classList.add('done');
  $('#rPhase').textContent='TERMINÉ';$('#rTime').textContent='00:00';
  $('#rRound').textContent='Bien joué !';$('#rTotal').textContent='';
  $('#rBar').style.transform='scaleX(1)';
  vib([300,100,300,100,300]);snd(t=>bell(t,3));
  unlockScreen();
}
function closeRun(){
  clearInterval(timer);unlockScreen();S=null;
  $('#run').hidden=true;$('#home').hidden=false;$('#startBar').hidden=false;
}
function togglePause(){
  if(!S||S.done)return;
  const now=performance.now();
  if(S.paused){S.paused=false;S.endAt=now+S.remAtPause;$('#run').classList.remove('paused');$('#bPause').textContent='Pause';unlockAudio()}
  else{S.paused=true;S.remAtPause=Math.max(0,S.endAt-now);$('#run').classList.add('paused');$('#bPause').textContent='Reprendre'}
}
function jump(dir){
  if(!S||S.done)return;
  const now=performance.now(),ph=S.phases[S.i];
  let target=S.i+1;
  if(dir<0){
    const left=S.paused?S.remAtPause:S.endAt-now;
    target=(ph.d*1000-left>2000)?S.i:Math.max(0,S.i-1);
  }
  if(target>=S.phases.length){finish();return}
  enterPhase(target,now);
  if(S.paused)S.remAtPause=S.phases[target].d*1000;
  phaseSound(S.phases[target]);
  render(S.phases[target].d*1000);
}
$('#start').addEventListener('click',startRun);
$('#bPause').addEventListener('click',togglePause);
$('#bPrev').addEventListener('click',()=>jump(-1));
$('#bNext').addEventListener('click',()=>jump(1));
$('#bStop').addEventListener('click',closeRun);
$('#bClose').addEventListener('click',closeRun);
$('#bAgain').addEventListener('click',startRun);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S&&!S.done){e.preventDefault();togglePause()}});

/* ---------- PWA ---------- */
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').addEventListener('click',async()=>{if(dp){dp.prompt();dp=null;$('#inst').hidden=true}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}

setMode(st.mode);
})();
</script>
